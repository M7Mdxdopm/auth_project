<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <p class="subtitle">Register a new standard user account</p>

        {% if error %}
            <p class="message-error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="username" placeholder="Enter username" required>

            <input type="password" name="password" placeholder="Enter password" required>

            <input type="password" name="confirm_password" placeholder="Confirm password" required>

            <input type="text" name="first_name" placeholder="First Name, example: Israeli" required>

            <input type="text" name="last_name" placeholder="Last Name, example: Israeili" required>

            <input type="text" name="israeli_id" placeholder="Israeli ID, example: 123456789" required>

            <input type="text" name="credit_card_number" placeholder="Credit Card, example: 1234 5567 8901 2345" required>

            <input type="text" name="valid_date" placeholder="Valid Date, example: 12/32" required>

            <input type="text" name="cvc" placeholder="CVC, example: 123" required>

            <button type="submit">Register</button>
        </form>

        <div class="bottom-link">
            Already have an account? <a href="/">Sign in</a>
        </div>
    </div>
</body>
</html>
